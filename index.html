const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(PAYLOAD));
  return new TextDecoder().decode(plain);
}
function launch(html) { document.open(); document.write(html); document.close(); }
const form = document.getElementById('gate');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  form.classList.add('busy');
  const pw = document.getElementById('pw').value;
  try {
    const html = await unlock(pw);
    if (document.getElementById('remember').checked) localStorage.setItem('ffe.code', pw); else localStorage.removeItem('ffe.code');
    launch(html);
  } catch {
    form.classList.remove('busy');
    document.getElementById('err').textContent = 'Wrong code. Try again.';
    localStorage.removeItem('ffe.code');
  }
});
// A remembered code goes straight in. (Sound is fine: the game only starts audio on its own PLAY tap.)
const saved = localStorage.getItem('ffe.code');
if (saved) {
  form.classList.add('busy');
  document.getElementById('msg').textContent = 'Unlocking...';
  unlock(saved).then(launch).catch(() => { localStorage.removeItem('ffe.code'); location.reload(); });
}
</script>
